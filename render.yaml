# Render Blueprint: one free web service built from the Dockerfile.
# The free plan sleeps after 15 minutes idle. With no payment method on the account,
# Render suspends the service at its limits instead of charging.
services:
  - type: web
    name: homecare-intelligence
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    # Deploy a commit only after its GitHub checks pass.
    autoDeployTrigger: checksPass
