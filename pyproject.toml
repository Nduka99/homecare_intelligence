# Dependencies are managed with uv: `uv sync` builds .venv from uv.lock (committed).
# Add one with `uv add <pkg>` (runtime) or `uv add --dev <pkg>`; never pip-install ad hoc.

[project]
name = "homecare-intelligence"
version = "0.1.0"
description = "Care-notes extraction, carer-visit matching and retention analytics for a synthetic home-care agency"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
homecare = "homecare.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "playwright==1.63.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-networkx>=3.6.1.20261031",
]
lab = [
    "ortools>=9.15.6755",
    "osmnx>=2.1.1",
    "scikit-learn>=1.9.1",
]
# Queue-ranking and tamper-tag studies (CPU encoders). Capped at the newest releases at least two
# weeks old when added (2026-11-06), to lower supply-chain risk. On Windows, PyPI's torch is CPU-only.
rank = [
    "torch>=2.14.1,<2.16",
    "transformers>=5.20.2,<5.21",
]

# `uv sync` installs every group on the laptop. CI skips `rank` (on Linux, torch pulls about 3 GB of
# CUDA, and no test needs it). The serving image installs none: scripts/check.py exports
# requirements/serve.lock with --no-default-groups, which keeps the image small enough for a free
# 512 MB host.
[tool.uv]
default-groups = ["dev", "lab", "rank"]

[build-system]
requires = ["uv_build>=0.11,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "homecare"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# "S" is Bandit's security rules. Each accepted finding below was read, with its reason.
select = ["E", "F", "I", "B", "UP", "S"]
# `random` only seeds synthetic data, shuffles and statistics; every security value (session and
# CSRF tokens, salts, the audit key) uses `secrets`.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
# Tests check their results with assert.
"tests/**" = ["S101"]
# Fixed command lists with no shell, run on the developer's own machine.
"scripts/check.py" = ["S603", "S607"]
"scripts/stack_check.py" = ["S603", "S607"]
"scripts/cluster.py" = ["S603", "S607"]
# The attack tests name the service-account token's path and write to temp paths inside probe
# pods on purpose: those are the attacks. No password or local temp file is involved.
"scripts/cluster_check.py" = ["S603", "S607", "S105", "S108"]
# Opens only the local test server it started (http://127.0.0.1).
"scripts/ui_check.py" = ["S310"]
# Talk only to the local llama-server started from a pinned path (http://127.0.0.1).
"src/homecare/llm.py" = ["S310"]
"src/homecare/models.py" = ["S310", "S603"]
# SQL put together only from the fixed fragments in screens.py (VISIBLE, READ, ARRIVAL); every
# value is still a ? parameter.
"src/homecare/app/screens.py" = ["S608"]
"src/homecare/app/main.py" = ["S608"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

# OR-Tools and scikit-learn ship no type hints. torch, transformers and safetensors are typed, but
# CI does not install the `rank` group, so they are missing there; only nli.py and tamper.py
# import them.
[[tool.mypy.overrides]]
module = ["ortools.*", "sklearn.*", "torch.*", "transformers.*", "safetensors.*"]
ignore_missing_imports = true

# transformers leaves DebertaV2Model and Module.eval untyped; only tamper.py calls them.
[[tool.mypy.overrides]]
module = ["homecare.tamper"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
