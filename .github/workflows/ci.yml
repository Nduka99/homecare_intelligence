# Runs the same checks as a developer's machine. Render deploys only after this passes.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned by commit, checked 2026-11-04: checkout v7.0.1, setup-uv v10.3.3.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - run: uv sync --locked --no-group rank
      - run: uv run python scripts/check.py
